<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLESWAR GUILD - Boss Timer</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --table-bg: #111e38;
            --header-bg: #1b2a4a;
            --border-color: #233b63;
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .controls {
            margin-bottom: 25px;
        }
        select {
            padding: 10px 15px;
            background-color: var(--header-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        .table-container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--table-bg);
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--header-bg);
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }
        .btn-action {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover {
            opacity: 0.8;
        }
        .status-vivo {
            color: var(--success);
            font-weight: bold;
        }
        .status-tiempo {
            color: var(--accent);
            font-weight: bold;
        }
        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>BLESWAR GUILD</h1>
    <div id="subInfo" class="subtitle">MONITOREO DE BOSSES EN TIEMPO REAL</div>

    <div class="controls">
        <label for="bossSelect">Seleccionar Boss: </label>
        <select id="bossSelect" onchange="cambiarBoss()">
            <!-- Se llena por JavaScript -->
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Servidor</th>
                    <th>Última Muerte</th>
                    <th>Último Cazador</th>
                    <th>Próximo Respawn Estimado</th>
                    <th>Tiempo Restante</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <!-- Filas generadas dinámicamente -->
            </tbody>
        </table>
    </div>

    <footer>
        BLESWAR SYSTEM • DESARROLLADO PARA GESTIÓN DE JEFES MEGAMU
    </footer>

    <script src="bosses.js"></script>
    <script src="script.js"></script>
</body>
</html>
