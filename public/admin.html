<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BLESWAR</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b1329; color: #fff; padding: 20px; text-align: center; }
        h2 { color: #38bdf8; }
        .container { max-width: 900px; margin: 0 auto; background: #111e38; padding: 20px; border-radius: 10px; border: 1px solid #233b63; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid #233b63; text-align: center; }
        th { background: #1b2a4a; color: #38bdf8; }
        select { background: #1b2a4a; color: #fff; border: 1px solid #38bdf8; padding: 5px; border-radius: 4px; outline: none; }
        button { padding: 5px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #0369a1; color: white; margin-left: 10px; }
        button:hover { background: #0284c7; }
        .nav-links { margin-bottom: 20px; display: flex; justify-content: space-between; }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        footer { margin-top: 30px; color: #94a3b8; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">👈 Ir al Boss Tracker</a>
            <a href="/api/logout">Cerrar Sesión</a>
        </div>
        <h2>Gestión Avanzada de Usuarios</h2>
        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nick</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios">
                <tr><td colspan="5">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>
    <footer>Página Web Desarrollada por Myzor y Aravigel</footer>

    <script>
        let currentUser = "";
        async function cargarUsuarios() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if(data.success) {
                currentUser = data.currentUser;
                const tbody = document.getElementById("tablaUsuarios");
                tbody.innerHTML = "";
                data.users.forEach(u => {
                    let tr = document.createElement("tr");
                    if(u.username === currentUser) {
                        tr.innerHTML = `<td>${u.username}</td><td><b>${u.character_nick || '-'}</b></td><td>${u.role}</td><td><b>${u.status}</b></td><td>Tú (Admin)</td>`;
                    } else {
                        tr.innerHTML = `
                            <td>${u.username}</td>
                            <td><b>${u.character_nick || '-'}</b></td>
                            <td>
                                <select id="role-${u.id}">
                                    <option value="user" ${u.role==='user'?'selected':''}>Usuario</option>
                                    <option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option>
                                </select>
                            </td>
                            <td>
                                <select id="status-${u.id}">
                                    <option value="pending" ${u.status==='pending'?'selected':''}>Pendiente</option>
                                    <option value="active" ${u.status==='active'?'selected':''}>Activo (Autorizado)</option>
                                    <option value="banned" ${u.status==='banned'?'selected':''}>Baneado</option>
                                </select>
                            </td>
                            <td><button onclick="guardarCambios(${u.id})">Guardar</button></td>
                        `;
                    }
                    tbody.appendChild(tr);
                });
            }
        }

        async function guardarCambios(userId) {
            const status = document.getElementById(`status-${userId}`).value;
            const role = document.getElementById(`role-${userId}`).value;
            await fetch('/api/admin/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, status, role })
            });
            alert("Cambios guardados");
            cargarUsuarios();
        }

        cargarUsuarios();
    </script>
</body>
</html>
