<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BLESWAR</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b1329; color: #fff; padding: 20px; text-align: center; }
        h2 { color: #38bdf8; }
        .container { max-width: 900px; margin: 0 auto; background: #111e38; padding: 20px; border-radius: 10px; border: 1px solid #233b63; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid #233b63; text-align: center; }
        th { background: #1b2a4a; color: #38bdf8; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-activar { background: #22c55e; color: #fff; }
        .btn-ban { background: #ef4444; color: #fff; }
        .nav-links { margin-bottom: 20px; display: flex; justify-content: space-between; }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">👈 Ir al Boss Tracker</a>
            <a href="/api/logout">Cerrar Sesión</a>
        </div>
        <h2>Panel de Administración de Usuarios</h2>
        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nick del Personaje</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios">
                <tr><td colspan="5">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function cargarUsuarios() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if(data.success) {
                const tbody = document.getElementById("tablaUsuarios");
                tbody.innerHTML = "";
                data.users.forEach(u => {
                    let tr = document.createElement("tr");
                    let acciones = u.role === 'admin' ? '<span>Administrador</span>' : `
                        ${u.status !== 'active' ? `<button class="btn-activar" onclick="cambiarEstado(${u.id}, 'active')">Aprobar</button>` : ''}
                        ${u.status !== 'banned' ? `<button class="btn-ban" onclick="cambiarEstado(${u.id}, 'banned')">Banear</button>` : ''}
                    `;
                    tr.innerHTML = `<td>${u.username}</td><td><b>${u.character_nick || '-'}</b></td><td>${u.role}</td><td><b>${u.status}</b></td><td>${acciones}</td>`;
                    tbody.appendChild(tr);
                });
            }
        }

        async function cambiarEstado(userId, status) {
            await fetch('/api/admin/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, status })
            });
            cargarUsuarios();
        }

        cargarUsuarios();
    </script>
</body>
</html>
