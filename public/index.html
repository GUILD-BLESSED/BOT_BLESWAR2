<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLESWAR GUILD - Boss Timer</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --table-bg: #111e38;
            --header-bg: #1b2a4a;
            --border-color: #233b63;
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: var(--accent); margin-bottom: 5px; letter-spacing: 2px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; }
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
        select, button {
            padding: 10px 15px;
            background-color: var(--header-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        button { background-color: #0369a1; font-weight: bold; }
        button:hover { background-color: #0284c7; }
        .table-container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--table-bg);
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--header-bg); color: var(--accent); text-transform: uppercase; font-size: 0.8rem; }
        tr:hover { background-color: rgba(56, 189, 248, 0.05); }
        .status-vivo { color: var(--success); font-weight: bold; }
        .status-tiempo { color: var(--accent); font-weight: bold; }
        .alerta-10 { color: var(--warning); font-weight: bold; animation: parpadeo 1s infinite; }
        .alerta-5 { color: var(--danger); font-weight: bold; animation: parpadeo 0.5s infinite; }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        footer { margin-top: 30px; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>

    <h1>BLESWAR GUILD</h1>
    <div id="subInfo" class="subtitle">MONITOREO DE BOSSES EN TIEMPO REAL</div>

    <div class="controls">
        <div>
            <label for="bossSelect">Boss: </label>
            <select id="bossSelect" onchange="cambiarBoss()"></select>
        </div>
        <button id="btnAudio" onclick="activarAudio()">🔊 Activar Alertas Sonoras</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Servidor</th>
                    <th>Última Muerte (Log)</th>
                    <th>Último Cazador</th>
                    <th>Próximo Respawn Estimado</th>
                    <th>Tiempo Restante</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr><td colspan="5" style="text-align:center;">🔄 Conectando con el servidor BLESWAR...</td></tr>
            </tbody>
        </table>
    </div>

    <footer>BLESWAR SYSTEM • DESARROLLADO PARA GESTIÓN DE JEFES MEGAMU</footer>

    <script src="script.js"></script>
</body>
</html>
